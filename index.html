<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Crumb Empire — a cookie clicker</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  :root {
    --dough: #3a2418;
    --dough-light: #5c3a25;
    --crust: #b9713f;
    --crust-light: #d9955f;
    --choc: #2b1a12;
    --sugar: #f6e9d8;
    --sugar-dim: #d8c4a8;
    --ember: #e8853a;
    --ember-hot: #ff9d4d;
    --burnt: #7a3b1e;
    --shadow: rgba(20, 10, 5, 0.5);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--dough);
    background-image:
      radial-gradient(circle at 15% 20%, rgba(217,149,95,0.08) 0%, transparent 35%),
      radial-gradient(circle at 85% 75%, rgba(232,133,58,0.07) 0%, transparent 40%);
    color: var(--sugar);
    font-family: 'Courier New', ui-monospace, monospace;
    overflow-x: hidden;
  }

  .wrap {
    display: grid;
    grid-template-columns: 1fr 340px;
    min-height: 100vh;
  }

  @media (max-width: 780px) {
    .wrap { grid-template-columns: 1fr; }
  }

  /* ---------- HEADER ---------- */
  .brand {
    grid-column: 1 / -1;
    padding: 18px 28px 10px;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    border-bottom: 1px dashed var(--dough-light);
  }
  .brand h1 {
    font-family: Georgia, 'Times New Roman', serif;
    font-style: italic;
    font-size: 26px;
    letter-spacing: 0.5px;
    margin: 0;
    color: var(--ember-hot);
    text-shadow: 0 0 18px rgba(255,157,77,0.25);
  }
  .brand .tag {
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--sugar-dim);
    opacity: 0.7;
  }

  /* ---------- MAIN / OVEN ---------- */
  .main {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 30px 20px 60px;
    position: relative;
  }

  .count {
    text-align: center;
    margin-top: 10px;
  }
  .count .num {
    font-family: Georgia, serif;
    font-size: 64px;
    font-weight: bold;
    color: var(--sugar);
    line-height: 1;
    letter-spacing: -1px;
  }
  .count .label {
    font-size: 12px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--ember);
    margin-top: 4px;
  }
  .count .rate {
    margin-top: 8px;
    font-size: 12px;
    color: var(--sugar-dim);
    min-height: 16px;
  }

  .cookie-stage {
    position: relative;
    margin-top: 34px;
    width: 260px;
    height: 260px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #cookie {
    width: 230px;
    height: 230px;
    cursor: pointer;
    filter: drop-shadow(0 10px 24px var(--shadow));
    transition: transform 0.06s ease;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #cookie:active { transform: scale(0.93); }
  #cookie.thump { animation: thump 0.18s ease; }
  @keyframes thump {
    0% { transform: scale(1); }
    40% { transform: scale(1.07) rotate(-1deg); }
    100% { transform: scale(1); }
  }

  .crumb {
    position: absolute;
    pointer-events: none;
    font-family: Georgia, serif;
    font-weight: bold;
    color: var(--ember-hot);
    font-size: 18px;
    opacity: 0;
    animation: floatUp 0.9s ease-out forwards;
    text-shadow: 0 0 8px rgba(0,0,0,0.4);
  }
  @keyframes floatUp {
    0% { opacity: 1; transform: translate(-50%, 0) scale(1); }
    100% { opacity: 0; transform: translate(-50%, -70px) scale(1.15); }
  }

  .hint {
    margin-top: 26px;
    font-size: 11px;
    color: var(--sugar-dim);
    opacity: 0.6;
    text-align: center;
    max-width: 260px;
  }

  /* ---------- SIDEBAR ---------- */
  .sidebar {
    background: var(--choc);
    border-left: 1px solid var(--dough-light);
    padding: 20px 16px 40px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .sidebar h2 {
    font-family: Georgia, serif;
    font-style: italic;
    font-size: 16px;
    color: var(--ember);
    margin: 6px 0 12px;
    padding-bottom: 8px;
    border-bottom: 1px dashed var(--dough-light);
  }

  .item {
    background: var(--dough-light);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 6px;
    padding: 10px 12px;
    cursor: pointer;
    display: flex;
    gap: 12px;
    align-items: center;
    transition: background 0.12s, transform 0.08s, border-color 0.12s;
    position: relative;
    overflow: hidden;
  }
  .item:hover:not(.locked) {
    background: var(--burnt);
    transform: translateX(2px);
  }
  .item:active:not(.locked) { transform: scale(0.98) translateX(2px); }
  .item.locked {
    opacity: 0.4;
    cursor: not-allowed;
    filter: grayscale(0.4);
  }
  .item .icon {
    font-size: 26px;
    width: 34px;
    text-align: center;
    flex-shrink: 0;
  }
  .item .info { flex: 1; min-width: 0; }
  .item .name {
    font-size: 13px;
    font-weight: bold;
    color: var(--sugar);
  }
  .item .desc {
    font-size: 10px;
    color: var(--sugar-dim);
    opacity: 0.75;
    margin-top: 1px;
  }
  .item .meta {
    text-align: right;
    flex-shrink: 0;
  }
  .item .price {
    font-size: 12px;
    color: var(--ember-hot);
    font-weight: bold;
  }
  .item .owned {
    font-size: 10px;
    color: var(--sugar-dim);
    margin-top: 2px;
  }

  .footer-note {
    margin-top: auto;
    padding-top: 14px;
    font-size: 10px;
    color: var(--sugar-dim);
    opacity: 0.45;
    text-align: center;
    border-top: 1px dashed var(--dough-light);
  }

  .reset-btn {
    margin-top: 10px;
    background: none;
    border: 1px solid var(--dough-light);
    color: var(--sugar-dim);
    font-size: 10px;
    letter-spacing: 1px;
    text-transform: uppercase;
    padding: 6px 10px;
    border-radius: 4px;
    cursor: pointer;
    align-self: center;
  }
  .reset-btn:hover { border-color: var(--ember); color: var(--ember); }
</style>
</head>
<body>

<div class="wrap">
  <div class="brand">
    <h1>Crumb Empire</h1>
    <div class="tag">Est. Just Now</div>
  </div>

  <div class="main">
    <div class="count">
      <div class="num" id="cookieCount">0</div>
      <div class="label">cookies baked</div>
      <div class="rate" id="rate"></div>
    </div>

    <div class="cookie-stage" id="stage">
      <svg id="cookie" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <radialGradient id="cookieGrad" cx="35%" cy="30%" r="75%">
            <stop offset="0%" stop-color="#d9955f"/>
            <stop offset="55%" stop-color="#c47f45"/>
            <stop offset="100%" stop-color="#a06334"/>
          </radialGradient>
        </defs>
        <circle cx="100" cy="100" r="88" fill="url(#cookieGrad)" stroke="#7a3b1e" stroke-width="3"/>
        <circle cx="65" cy="60" r="9" fill="#3d2314"/>
        <circle cx="120" cy="50" r="7" fill="#3d2314"/>
        <circle cx="145" cy="90" r="8" fill="#3d2314"/>
        <circle cx="60" cy="115" r="6" fill="#3d2314"/>
        <circle cx="95" cy="140" r="9" fill="#3d2314"/>
        <circle cx="140" cy="140" r="6" fill="#3d2314"/>
        <circle cx="110" cy="95" r="5" fill="#3d2314"/>
        <circle cx="70" cy="150" r="5" fill="#3d2314"/>
        <circle cx="160" cy="115" r="5" fill="#3d2314"/>
        <circle cx="35" cy="90" r="5" fill="#3d2314"/>
      </svg>
    </div>

    <div class="hint">Click the cookie. Spend crumbs on staff and equipment to bake faster, even while you're not clicking.</div>
  </div>

  <div class="sidebar">
    <h2>The Bakery</h2>
    <div id="itemList"></div>
    <button class="reset-btn" id="resetBtn">Start Over</button>
    <div class="footer-note">Progress lives only in this tab — refreshing clears it.</div>
  </div>
</div>

<script>
(function () {
  const itemDefs = [
    { id: 'apprentice', name: 'Apprentice Baker', desc: '+0.1 cookies/sec', icon: '🧑‍🍳', basePrice: 15,  cps: 0.1 },
    { id: 'grandma',    name: 'Grandma',          desc: '+1 cookie/sec',   icon: '👵', basePrice: 100, cps: 1 },
    { id: 'oven',       name: 'Backyard Oven',    desc: '+8 cookies/sec',  icon: '🔥', basePrice: 500, cps: 8 },
    { id: 'stand',      name: 'Bake Sale Stand',  desc: '+40 cookies/sec', icon: '🏪', basePrice: 3000, cps: 40 },
    { id: 'factory',    name: 'Cookie Factory',   desc: '+200 cookies/sec', icon: '🏭', basePrice: 15000, cps: 200 },
    { id: 'farm',       name: 'Flour Farm',       desc: '+1000 cookies/sec', icon: '🌾', basePrice: 80000, cps: 1000 },
  ];

  let cookies = 0;
  let clickPower = 1;
  const owned = {};
  itemDefs.forEach(d => owned[d.id] = 0);

  const cookieCountEl = document.getElementById('cookieCount');
  const rateEl = document.getElementById('rate');
  const cookieEl = document.getElementById('cookie');
  const stageEl = document.getElementById('stage');
  const itemListEl = document.getElementById('itemList');

  function fmt(n) {
    if (n < 1000) return Math.floor(n).toString();
    const units = ['K','M','B','T','Qa','Qi'];
    let u = -1;
    let val = n;
    while (val >= 1000 && u < units.length - 1) {
      val /= 1000;
      u++;
    }
    return val.toFixed(val < 10 ? 2 : 1) + units[u];
  }

  function currentPrice(def) {
    return Math.ceil(def.basePrice * Math.pow(1.15, owned[def.id]));
  }

  function totalCps() {
    return itemDefs.reduce((sum, d) => sum + d.cps * owned[d.id], 0);
  }

  function render() {
    cookieCountEl.textContent = fmt(cookies);
    const cps = totalCps();
    rateEl.textContent = cps > 0 ? `${fmt(cps)} cookies/sec` : '';

    itemListEl.querySelectorAll('.item').forEach(el => {
      const id = el.dataset.id;
      const def = itemDefs.find(d => d.id === id);
      const price = currentPrice(def);
      const affordable = cookies >= price;
      el.classList.toggle('locked', !affordable);
      el.querySelector('.price').textContent = fmt(price);
      el.querySelector('.owned').textContent = 'owned: ' + owned[id];
    });
  }

  function buildList() {
    itemListEl.innerHTML = '';
    itemDefs.forEach(def => {
      const el = document.createElement('div');
      el.className = 'item';
      el.dataset.id = def.id;
      el.innerHTML = `
        <div class="icon">${def.icon}</div>
        <div class="info">
          <div class="name">${def.name}</div>
          <div class="desc">${def.desc}</div>
        </div>
        <div class="meta">
          <div class="price">${fmt(currentPrice(def))}</div>
          <div class="owned">owned: 0</div>
        </div>
      `;
      el.addEventListener('click', () => buy(def));
      itemListEl.appendChild(el);
    });
  }

  function buy(def) {
    const price = currentPrice(def);
    if (cookies < price) return;
    cookies -= price;
    owned[def.id]++;
    render();
  }

  function spawnCrumb(x, y, amount) {
    const c = document.createElement('div');
    c.className = 'crumb';
    c.textContent = '+' + fmt(amount);
    c.style.left = x + 'px';
    c.style.top = y + 'px';
    stageEl.appendChild(c);
    setTimeout(() => c.remove(), 900);
  }

  cookieEl.addEventListener('click', (e) => {
    cookies += clickPower;
    cookieEl.classList.remove('thump');
    void cookieEl.offsetWidth;
    cookieEl.classList.add('thump');

    const rect = stageEl.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;
    spawnCrumb(x, y, clickPower);

    render();
  });

  document.getElementById('resetBtn').addEventListener('click', () => {
    if (!confirm('Clear all progress and start over?')) return;
    cookies = 0;
    itemDefs.forEach(d => owned[d.id] = 0);
    render();
  });

  let lastTick = performance.now();
  function loop(now) {
    const dt = (now - lastTick) / 1000;
    lastTick = now;
    const cps = totalCps();
    if (cps > 0) {
      cookies += cps * dt;
      render();
    }
    requestAnimationFrame(loop);
  }

  buildList();
  render();
  requestAnimationFrame(loop);
})();
</script>

</body>
</html>
